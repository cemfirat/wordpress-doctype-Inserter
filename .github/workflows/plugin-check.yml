name: WordPress Plugin Check pilot

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  plugin-check:
    name: Official WordPress Plugin Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build release package contents
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package.py
          BUILD_DIR="$RUNNER_TEMP/plugin-check-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          unzip -q dist/doctype-inserter.zip -d "$BUILD_DIR"
          test -f "$BUILD_DIR/wordpress-doctype-Inserter/doctype-inserter.php"

      - name: Run official WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/plugin-check-build/wordpress-doctype-Inserter
          slug: doctype-inserter
          # This plugin is distributed from GitHub, not the WordPress.org directory.
          # Keep cross-distribution quality checks while excluding directory-only policy.
          categories: |
            general
            security
            performance
            accessibility
          include-experimental: 'false'
          repo-token: ''
